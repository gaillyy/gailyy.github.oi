<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="wrapper">
        <form action="">
            <h1>Login</h1>
            <div class="input-box">
                <input type="text" placeholder="Username" required>
                <i class='bx bxs-user'></i>
            </div>
            <div class="input-box">
                <input type="password" placeholder="Password" required>
                <i class='bx bxs-lock-alt'></i>
            </div>
            <div class="remember-forgot">
                <label><input type="checkbox">Remember me</label>
                <a href="#">Forgot password</a>
            </div>
            <button type="submit" class="btn">Login</button>
            <div class="register-link">
                <p>Dont have an account? <a href="#">Resgister</a></p>
            </div>
        </form>
    </div>
    <style>
@import url('https://font.googleapis.com/css?family=Poppins:wght300;400;500;60;700;800;900&display=swap');
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins",sans-serif;
}
body{
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: url("img.avif") no-repeat;
    background-size: cover;
    background-position: center;
}
.wrapper{
    width: 420px;
    background-color: transparent;
    border:2px solid rgba(243, 132, 201, 0.2);
    backdrop-filter: blur(15px);
    box-shadow: 0 0 10px rgba(75, 74, 74, 0.2);
    color: #f0448c;
    border-radius: 10px;
    padding: 30px 40px;
}
.wrapper h1{
    font-size: 36px;
    text-align: center;
}
.wrapper .input-box{
    width: 100%;
    height: 50px;
    position: relative;
    margin: 30px 0 ;
}
.input-box input{
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    outline: none;
    border: 2px solid rgba(248, 162, 215, 0.2);
    border-radius: 40px;
    font-size: 16px;
    color: #f0448c;
    padding: 20px 45px 20px 20px;
}
.input-box input::placeholder{
    color: lightcoral;
}
.input-box i{
    position: absolute;
    right: 20px;
    top: 50px;
    transform: translateY(-50%);
    font-size: 20px;
}
.wrapper .remember-forgot{
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin: -15px 0 15px;
}
.remember-forgot label input{
    accent-color: lightcoral;
    margin-right: 3px;
}
.remember-forgot a{
    color: lightcoral;
    text-decoration: none;
}
.remember-forgot a:hover{
    text-decoration: underline;
}
.wrapper .btn{
    width: 100%;
    height: 45px;
    background: #e79bbb;
    border: none;
    outline: none;
    border-radius: 40px;
    box-shadow: 0 0 10px rgba(0, 0, 0, .1);
    cursor: pointer;
    font-size: 16px;
    color: #f0448c;
    font-weight: 600;
}
.btn:hover{
    background-color: hsl(326, 39%, 72%);
}
.btn:active{
    background-color: hsl(326, 85%, 37%);
}
.wrapper .register-link {
    text-align: center;
    font-size: 14px;
    margin: 20px 0 15px;
}
.wrapper .register-link p a{
    color: violet;
    text-decoration: none;
    font-weight: 600;
}
.wrapper .register-link p a:hover{
    text-decoration: underline;
}
    </style>
</body>
</html>
